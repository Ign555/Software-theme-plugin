[theme_info]
name=UwU theme
description=The best uwu theme for Geany.
version=1.0.0
author=Ign555
# list of each compatible Geany release version
compat=1.38;2.0;

[named_styles]

default=#FFE8FF;#555555;false;false
error=#e37170;#292929;false;italic

# Editor styles
#-------------------------------------------------------------------------------

selection=#888888;#ffe8ff;true;true
current_line=#FFFFFF;#555555;true
brace_good=#888888;#a8d5a2;true;false
brace_bad=#888888;#ffffa6;true;false
margin_line_number=#6E6E6E;#555555
margin_folding=#5C5C5C;#555555
fold_symbol_highlight=#555555
indent_guide=#595959
caret=#fff;#fff;false;
marker_line=#000000;#E7A96B
marker_search=marker_line
marker_mark=#545454;#95BFD7
call_tips=#939393;#262626;false;false
white_space=#595959;#000000;true;false

# Programming languages
#-------------------------------------------------------------------------------

comment=#ADADAD 
comment_doc=comment
comment_line=comment
comment_line_doc=comment_doc
comment_doc_keyword=comment_doc,bold
comment_doc_keyword_error=comment_doc,italic

#ok
number=#FFA0FF
number_1=number
number_2=number_1

type=#FFE8FF;;true;false
class=type
function=#cc8ad4
parameter=#23B0E6

keyword=#FFA0FF;;true;false
keyword_1=keyword
keyword_2=keyword_1
keyword_3=keyword_1
keyword_4=keyword_1

#ok
identifier=default
identifier_1=#d9a4ff
identifier_2=default
identifier_3=default
identifier_4=default

string=#7facff
string_1=string
string_2=string_1
string_3=default
string_4=default
string_eol=string_1;#7facff;false;false
character=string_1
backticks=string_2
here_doc=string_2

label=default,bold
preprocessor=#A8D5A2
regex=number_1
operator=#ffe1a6
decorator=string_1,bold
other=default

# Markup-type languages
#-------------------------------------------------------------------------------

tag=#80B8FF
tag_unknown=tag,bold
tag_end=tag,bold
attribute=#85C6CC
attribute_unknown=attribute,bold
value=string_1
entity=default

# Diff
#-------------------------------------------------------------------------------

line_added=#75C075;#ffffff;false;false
line_removed=#FF7E7E;#ffffff;false;false
line_changed=#A46FA4;#ffffff;false;false
